name: postgres-query-optimizer
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  environment: &backend-env
    PGO_APP_DSN: postgresql+psycopg://pgo_app:local_app_only@app-db:5432/pgo_app
    PGO_READ_DSN: postgresql://pgo_reader:local_reader_only@benchmark-db:5432/pgo_benchmark
    PGO_ADMIN_DSN: postgresql://pgo_experiment:local_experiment_only@benchmark-db:5432/pgo_benchmark
    PGO_STATE_DIR: /app/state
    PGO_OPENAI_API_KEY: ${PGO_OPENAI_API_KEY:-}
    PGO_MODEL: ${PGO_MODEL:-gpt-4.1-mini}
    PGO_API_TOKEN: ${PGO_API_TOKEN:-}
    PGO_OTLP_ENDPOINT: ${PGO_OTLP_ENDPOINT:-}
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  volumes:
    - worker-state:/app/state
services:
  app-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: local_bootstrap_only
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - app-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/app.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  benchmark-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: local_benchmark_bootstrap_only
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, shared_buffers=256MB, -c, max_connections=20, -c, work_mem=16MB]
    ports: ["127.0.0.1:5434:5432"]
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    volumes:
      - benchmark-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/benchmark.sql:/docker-entrypoint-initdb.d/01-benchmark.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      app-db: {condition: service_healthy}
  seed:
    <<: *backend
    command: [pg-optimizer, seed, --if-empty]
    depends_on:
      benchmark-db: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    command: [pg-optimizer, worker]
    restart: unless-stopped
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      PGO_API_TOKEN: ${PGO_API_TOKEN:-}
    ports: ["127.0.0.1:3000:3000"]
    init: true
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    profiles: [observability]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
volumes:
  app-data:
  benchmark-data:
  worker-state:
