[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-query-optimizer"
version = "0.1.0"
description = "Bounded SQL experiments with deterministic safety and measured acceptance"
requires-python = ">=3.11,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4",
 "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlglot>=30.18,<31",
 "langgraph>=0.6,<0.7", "langgraph-checkpoint-sqlite>=2,<3",
 "openai>=1.75,<2", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
 "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
 "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3"]
[project.scripts]
pg-optimizer = "optimizer.cli:main"
[tool.setuptools.packages.find]
where = ["packages"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires controlled PostgreSQL", "e2e: requires running services"]
